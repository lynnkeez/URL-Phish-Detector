<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="URL Phishing Guard - Check if URLs are safe with our locally-trained phishing detection model.">
<title>{% block title %}URL Phishing Guard{% endblock %}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

<!-- Skip to main content link for accessibility -->
<a href="#main-content" class="skip-link">Skip to main content</a>

<!-- Header -->
<header class="app-header">
  <div class="header-container">
    <div class="brand">
      <svg class="brand-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
        <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path>
        <path d="M12 12v4M10 14h4" stroke-width="2.5"></path>
      </svg>
      <h1 class="brand-name">URL Phishing Guard</h1>
    </div>
  </div>
</header>

<!-- Navigation -->
<nav class="topnav" aria-label="Main navigation">
  <div class="nav-container">
    <a href="{{ url_for('index') }}" class="nav-link {{ 'active' if active == 'check' else '' }}" aria-current="{% if active == 'check' %}page{% endif %}">
      <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
        <path d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path>
      </svg>
      <span>Check URL</span>
    </a>
    <a href="{{ url_for('result') }}" class="nav-link {{ 'active' if active == 'result' else '' }}" aria-current="{% if active == 'result' %}page{% endif %}">
      <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
        <path d="M9 12l2 2 4-4M7 12a5 5 0 1110 0 5 5 0 01-10 0z"></path>
      </svg>
      <span>Result</span>
    </a>
    <a href="{{ url_for('history') }}" class="nav-link {{ 'active' if active == 'history' else '' }}" aria-current="{% if active == 'history' %}page{% endif %}">
      <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
        <circle cx="12" cy="12" r="1"></circle>
        <path d="M12 7v5l3 3M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>
      </svg>
      <span>History</span>
    </a>
    <a href="{{ url_for('about') }}" class="nav-link {{ 'active' if active == 'about' else '' }}" aria-current="{% if active == 'about' %}page{% endif %}">
      <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
        <circle cx="12" cy="12" r="10"></circle>
        <path d="M12 16v-4M12 8h.01"></path>
      </svg>
      <span>How it works</span>
    </a>
  </div>
</nav>

<!-- Main Content -->
<main id="main-content" class="main-container">
  <div class="wrap">
    {% block content %}{% endblock %}
  </div>
</main>

<!-- Footer -->
<footer class="app-footer">
  <p>Runs entirely offline • No data stored or shared • Built with Python & scikit-learn</p>
</footer>

</body>
</html>
